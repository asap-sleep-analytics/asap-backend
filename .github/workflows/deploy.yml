name: Backend Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asap_test
          POSTGRES_USER: asap_test
          POSTGRES_PASSWORD: asap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Type check (mypy)
        run: |
          mypy app main.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://asap_test:asap_test@localhost:5432/asap_test
          AUTH_SECRET_KEY: test-key-for-ci-only-32-bytes-minimum
          ADMIN_DATASET_EXPORT_KEY: test-admin-key-for-ci-only-32-bytes
        run: |
          pytest tests/ -v --timeout=30

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/asap-backend

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-build-and-deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/asap-backend

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run database migrations
        if: env.DATABASE_URL != '' && env.AUTH_SECRET_KEY != '' && env.ADMIN_DATASET_EXPORT_KEY != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          ADMIN_DATASET_EXPORT_KEY: ${{ secrets.ADMIN_DATASET_EXPORT_KEY }}
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/asap-backend:main
          docker pull "$IMAGE"
          docker run --rm \
            --env DATABASE_URL="$DATABASE_URL" \
            --env AUTH_SECRET_KEY="$AUTH_SECRET_KEY" \
            --env ADMIN_DATASET_EXPORT_KEY="$ADMIN_DATASET_EXPORT_KEY" \
            "$IMAGE" alembic upgrade head
